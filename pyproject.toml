[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-training"
version = "0.1.0"
description = "Continued pretraining with next-token prediction"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6,<3",
    "transformers>=4.57.6,<4.58",
    "datasets>=3,<5",
    "accelerate>=1.10.1,<2",
    "safetensors>=0.4,<1",
    "filelock>=3.12",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
llm-train = "llm_training.training.train:main"
llm-evaluate = "llm_training.evaluation.evaluate:main"
llm-compare = "llm_training.training.compare:main"
llm-check-psychology = "llm_training.data.inspect_psychology:main"
llm-count-tokens = "llm_training.data.count_tokens:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
